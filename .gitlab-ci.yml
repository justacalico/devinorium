# GitLab CI for Devinorium
# Runs clippy, tests, and a release build on every push and MR.

stages:
  - check
  - test
  - build

variables:
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"

cache:
  key:
    files:
      - Cargo.lock
  paths:
    - target/
    - .cargo/registry/

before_script:
  - rustc --version
  - cargo --version

clippy:
  stage: check
  image: rust:1.83-bookworm
  script:
    - rustup component add clippy
    - cargo clippy --all-targets -- -D warnings
  allow_failure: true

fmt:
  stage: check
  image: rust:1.83-bookworm
  script:
    - rustup component add rustfmt
    - cargo fmt -- --check
  allow_failure: true

test:
  stage: test
  image: rust:1.83-bookworm
  script:
    - cargo test --all -- --test-threads=1
  artifacts:
    when: always
    reports:
      junit: target/test-results.xml
    paths:
      - target/test-results.xml
    expire_in: 1 week
  allow_failure: true

build-release:
  stage: build
  image: rust:1.83-bookworm
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/devinorium
    expire_in: 1 week
