spec:
  inputs:
    build_all:
      type: boolean
      default: true
      description: 'Build all targets (server, android, linux)'
    create_release:
      type: boolean
      default: false
      description: 'Create a versioned release'

---

stages:
  - sync
  - release

variables:
  GH_TOKEN: $GH_TOKEN
  GLAB_ENABLE_CI_AUTOLOGIN: "true"
  GLAB_VERSION: "1.113.0"
  GIT_DEPTH: "0"
  GIT_STRATEGY: "fetch"
  GIT_CLEAN_FLAGS: "-ffdx -e .ci-tools/ -e target/"

.github-common: &github-common
  tags: [linux-truenas]
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client

github-sync:
  stage: sync
  <<: *github-common
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache git openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$GITHUB_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - echo "" >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts
  script:
    - git remote add github git@github.com:justacalico/devinorium.git || true
    - git remote update github
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        git push -f github "$CI_COMMIT_TAG"
      else
        git push github HEAD:main
      fi

github-dispatch:
  stage: sync
  <<: *github-common
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    GH_TOKEN: $GH_TOKEN
  script:
    - |
      BUILD_ALL="$[[ inputs.build_all ]]"
      CREATE_RELEASE="$[[ inputs.create_release ]]"
      if [ "$CREATE_RELEASE" = "true" ]; then
        BUILD_ALL="true"
      fi
      bash scripts/trigger-github-build.sh main "$BUILD_ALL" "$CREATE_RELEASE"

github-mr-build:
  stage: sync
  <<: *github-common
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GH_TOKEN: $GH_TOKEN
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$GITHUB_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - echo "" >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts
  script:
    - bash scripts/trigger-github-build.sh "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" true false HEAD

github-release-sync:
  stage: release
  tags: [linux-truenas]
  image: alpine:3.19
  resource_group: release-sync
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "api"
  variables:
    GH_TOKEN: $GH_TOKEN
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    GLAB_VERSION: "1.113.0"
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - bash scripts/install-glab.sh
    - |
      if [ -n "${GITLAB_RELEASE_SSH_KEY:-}" ]; then
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        cp "$GITLAB_RELEASE_SSH_KEY" ~/.ssh/id_ed25519
        echo "" >> ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -t ed25519 gitlab.com > ~/.ssh/known_hosts
      fi
  script:
    - bash scripts/sync-from-github.sh
