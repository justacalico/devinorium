stages:
  - verify
  - build
  - release

variables:
  COCO_GITTO_VERSION: "7.0.0"
  GLAB_VERSION: "1.53.0"
  GLAB_ENABLE_CI_AUTOLOGIN: "true"
  FLUTTER_VERSION: "3.44.9"
  GIT_DEPTH: "0"

default:
  image: rust:1.88.0
  cache:
    key:
      files:
        - Cargo.lock
        - flutter/pubspec.lock
    paths:
      - /root/.cargo
      - /root/.local
      - /root/.pub-cache

.install: &install
  - export PATH="$HOME/.local/bin:$HOME/.local/flutter/bin:$PATH"
  - |
    if ! command -v flutter >/dev/null 2>&1; then
      mkdir -p "$HOME/.local"
      git clone -b "$FLUTTER_VERSION" --depth 1 https://github.com/flutter/flutter.git "$HOME/.local/flutter"
    fi
    flutter config --no-analytics >/dev/null
  - |
    if ! command -v cog >/dev/null 2>&1; then
      apt-get update -qq
      apt-get install -y -qq libgit2-dev cmake
      cargo install cocogitto --version "$COCO_GITTO_VERSION" --root "$HOME/.local"
    fi
  - |
    if ! command -v glab >/dev/null 2>&1; then
      mkdir -p "$HOME/.local"
      curl -fsSL --retry 3 -o /tmp/glab.tar.gz "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VERSION}/downloads/glab_${GLAB_VERSION}_linux_amd64.tar.gz"
      tar -xzf /tmp/glab.tar.gz -C "$HOME/.local"
      chmod +x "$HOME/.local/bin/glab"
    fi
  - export CARGO_HOME="$HOME/.cargo"

verify-cog:
  stage: verify
  tags: [linux-truenas]
  before_script:
    - *install
  script:
    - cog check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

verify-frontend:
  stage: verify
  tags: [linux-truenas]
  before_script:
    - *install
  script:
    - cd flutter && flutter pub get && flutter analyze --no-pub && flutter test --no-pub
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

verify-backend:
  stage: verify
  tags: [linux-truenas]
  before_script:
    - *install
  script:
    - cargo test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

build-image:
  stage: build
  tags: [linux-truenas]
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      auth=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$auth" > /kaniko/.docker/config.json
  script:
    - |
      destinations="--destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        destinations="$destinations --destination $CI_REGISTRY_IMAGE:latest"
      fi
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Containerfile" \
        $destinations \
        --cache=true \
        --cache-repo "$CI_REGISTRY_IMAGE/cache"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "feat/container-image"
  timeout: 2h

release:
  stage: release
  tags: [linux-truenas]
  resource_group: release
  retry:
    max: 2
    when: script_failure
  before_script:
    - *install
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
    - |
      if [ -z "${GITLAB_TOKEN:-}" ]; then
        echo "Error: GITLAB_TOKEN is required for release" >&2
        exit 1
      fi
      git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git fetch origin +refs/heads/main:refs/remotes/origin/main
    - git checkout -B main origin/main
    - git branch --set-upstream-to=origin/main main
  script:
    - |
      if ! cog bump --dry-run --auto >/dev/null 2>&1; then
        echo "No version bump required, skipping release"
        exit 0
      fi
    - cog bump --auto --skip-ci
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
