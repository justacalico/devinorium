spec:
  inputs:
    build_all:
      type: boolean
      default: true
      description: 'Build all targets (server, android, linux, linux-arm64, windows, windows-arm64, macos, ios)'
    create_release:
      type: boolean
      default: false
      description: 'Create a versioned release'

---

stages:
  - sync
  - release

variables:
  GH_TOKEN: $GH_TOKEN
  GLAB_ENABLE_CI_AUTOLOGIN: "true"
  GLAB_VERSION: "1.113.0"
  GIT_DEPTH: "0"
  GIT_STRATEGY: "fetch"
  GIT_CLEAN_FLAGS: "-ffdx -e .ci-tools/ -e target/"

.github-common: &github-common
  tags: [linux-truenas]
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client

github-sync:
  stage: sync
  <<: *github-common
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
  variables:
    GH_TOKEN: $GH_TOKEN
  before_script:
    - apk add --no-cache bash git github-cli openssh-client
    - sh scripts/setup-ssh-key.sh GITHUB_SSH_PRIVATE_KEY github.com
  script:
    - git remote add github git@github.com:justacalico/devinorium.git || true
    - git remote update github
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        LOCAL_SHA=$(git rev-parse "$CI_COMMIT_TAG")
        REMOTE_SHA=$(git ls-remote --tags github "refs/tags/$CI_COMMIT_TAG" | awk '{print $1}' | head -n1)
        if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" = "$LOCAL_SHA" ]; then
          echo "Tag $CI_COMMIT_TAG already mirrored to GitHub at $REMOTE_SHA, skipping"
        else
          git push -f github "$CI_COMMIT_TAG"
        fi
      else
        git push github HEAD:main
        # Watch the GitHub build for the pushed commit so a failed job on
        # GitHub also fails this pipeline.
        SHA=$(git rev-parse HEAD)
        RUN_ID=$(bash scripts/watch-github-run.sh find --sha "$SHA" --event push --branch main || true)
        if [ -z "$RUN_ID" ]; then
          echo "No GitHub run found for pushed commit $SHA" >&2
          exit 1
        fi
        bash scripts/watch-github-run.sh "$RUN_ID"
      fi

github-dispatch:
  stage: sync
  <<: *github-common
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    GH_TOKEN: $GH_TOKEN
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - sh scripts/setup-ssh-key.sh GITHUB_SSH_PRIVATE_KEY github.com
  script:
    - |
      BUILD_ALL="$[[ inputs.build_all ]]"
      CREATE_RELEASE="$[[ inputs.create_release ]]"
      if [ "$CREATE_RELEASE" = "true" ]; then
        BUILD_ALL="true"
      fi
      bash scripts/trigger-github-build.sh main "$BUILD_ALL" "$CREATE_RELEASE"

github-mr-build:
  stage: sync
  <<: *github-common
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GH_TOKEN: $GH_TOKEN
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - sh scripts/setup-ssh-key.sh GITHUB_SSH_PRIVATE_KEY github.com
  script:
    - bash scripts/trigger-github-build.sh "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" true false "$CI_COMMIT_SHA"

openlyst-release-trigger:
  stage: release
  tags: [linux-truenas]
  image: alpine:3.19
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Triggering Openlyst stable-release sync for $CI_COMMIT_TAG"
    - |
      curl -sf --request POST \
        --form "token=$OPENLYST_TRIGGER_TOKEN" \
        --form "ref=main" \
        --form "variables[DEVINORIUM_RELEASE_TAG]=$CI_COMMIT_TAG" \
        "${CI_SERVER_URL}/api/v4/projects/75502294/trigger/pipeline" > /dev/null

github-release-sync:
  stage: release
  tags: [linux-truenas]
  image: alpine:3.19
  resource_group: release-sync
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "api"
  variables:
    GH_TOKEN: $GH_TOKEN
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    GLAB_VERSION: "1.113.0"
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - bash scripts/install-glab.sh
    - sh scripts/setup-ssh-key.sh GITLAB_RELEASE_SSH_KEY gitlab.com
  script:
    - bash scripts/sync-from-github.sh
