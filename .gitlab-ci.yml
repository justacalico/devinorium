spec:
  inputs:
    build_all:
      type: boolean
      default: true
      description: 'Build all targets (server, server-windows, server-macos, android, linux, linux-arm64, windows, windows-arm64, macos, ios)'
    create_release:
      type: boolean
      default: false
      description: 'Create a versioned release'

---

stages:
  - sync
  - release

variables:
  GLAB_ENABLE_CI_AUTOLOGIN: "true"
  GLAB_VERSION: "1.113.0"
  GIT_DEPTH: "0"
  GIT_STRATEGY: "fetch"
  GIT_CLEAN_FLAGS: "-ffdx -e target/"

.github-common: &github-common
  tags: [linux-truenas]
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client

github-sync:
  stage: sync
  <<: *github-common
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache bash git github-cli openssh-client
    - sh scripts/setup-ssh-key.sh GITHUB_SSH_PRIVATE_KEY github.com
  script:
    - git remote add github git@github.com:justacalico/devinorium.git || true
    - git remote update github
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        LOCAL_SHA=$(git rev-parse "$CI_COMMIT_TAG")
        REMOTE_SHA=$(git ls-remote --tags github "refs/tags/$CI_COMMIT_TAG" | awk '{print $1}' | head -n1)
        # Only a real push triggers a fresh run; an already-mirrored tag
        # legitimately reuses the run that already exists for its commit.
        SINCE=""
        if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" = "$LOCAL_SHA" ]; then
          echo "Tag $CI_COMMIT_TAG already mirrored to GitHub at $REMOTE_SHA, skipping"
        else
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          git push -f github "$CI_COMMIT_TAG"
        fi
        # v* tags trigger the release build on GitHub; watch it so a failed
        # release build fails this pipeline.
        if echo "$CI_COMMIT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
          SHA=$(git rev-parse "$CI_COMMIT_TAG^{commit}")
          RUN_ID=$(bash scripts/watch-github-run.sh find --sha "$SHA" --event push ${SINCE:+--since "$SINCE"} || true)
          if [ -z "$RUN_ID" ]; then
            echo "No GitHub run found for tag $CI_COMMIT_TAG" >&2
            exit 1
          fi
          bash scripts/watch-github-run.sh "$RUN_ID"
        fi
      else
        SHA=$(git rev-parse HEAD)
        # A push that transfers nothing triggers no new run; only gate on
        # the trigger time when the ref actually moved.
        REMOTE_MAIN=$(git ls-remote github refs/heads/main | awk '{print $1}')
        SINCE=""
        if [ "$REMOTE_MAIN" != "$SHA" ]; then
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        fi
        git push github HEAD:main
        # Watch the GitHub build for the pushed commit so a failed job on
        # GitHub also fails this pipeline.
        RUN_ID=$(bash scripts/watch-github-run.sh find --sha "$SHA" --event push --branch main ${SINCE:+--since "$SINCE"} || true)
        if [ -z "$RUN_ID" ]; then
          echo "No GitHub run found for pushed commit $SHA" >&2
          exit 1
        fi
        bash scripts/watch-github-run.sh "$RUN_ID"
      fi

github-dispatch:
  stage: sync
  <<: *github-common
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - sh scripts/setup-ssh-key.sh GITHUB_SSH_PRIVATE_KEY github.com
  script:
    - |
      BUILD_ALL="$[[ inputs.build_all ]]"
      CREATE_RELEASE="$[[ inputs.create_release ]]"
      if [ "$CREATE_RELEASE" = "true" ]; then
        BUILD_ALL="true"
      fi
      bash scripts/trigger-github-build.sh main "$BUILD_ALL" "$CREATE_RELEASE"

github-mr-build:
  stage: sync
  <<: *github-common
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - sh scripts/setup-ssh-key.sh GITHUB_SSH_PRIVATE_KEY github.com
  script:
    - bash scripts/trigger-github-build.sh "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" true false "$CI_COMMIT_SHA"

auto-release:
  stage: release
  tags: [linux-truenas]
  image: alpine:3.19
  resource_group: auto-release
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: [github-sync]
  variables:
    COCOGITTO_VERSION: "7.0.0"
  before_script:
    - apk add --no-cache bash curl git
    - curl -fsSL --retry 3 -o /tmp/cog.tar.gz "https://github.com/cocogitto/cocogitto/releases/download/${COCOGITTO_VERSION}/cocogitto-${COCOGITTO_VERSION}-x86_64-unknown-linux-musl.tar.gz"
    - mkdir -p /tmp/cog && tar -xzf /tmp/cog.tar.gz -C /tmp/cog
    - install -m 755 /tmp/cog/x86_64-unknown-linux-musl/cog /usr/local/bin/cog
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - bash scripts/auto-release.sh

openlyst-release-trigger:
  stage: release
  tags: [linux-truenas]
  image: alpine:3.19
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Triggering Openlyst stable-release sync for $CI_COMMIT_TAG"
    - |
      curl -sf --request POST \
        --form "token=$OPENLYST_TRIGGER_TOKEN" \
        --form "ref=main" \
        "${CI_SERVER_URL}/api/v4/projects/75502294/trigger/pipeline" > /dev/null

github-release-sync:
  stage: release
  tags: [linux-truenas]
  image: alpine:3.19
  resource_group: release-sync
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "api"
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    GLAB_VERSION: "1.113.0"
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - bash scripts/install-glab.sh
    - sh scripts/setup-ssh-key.sh GITLAB_RELEASE_SSH_KEY gitlab.com
  script:
    - bash scripts/sync-from-github.sh

docker-image:
  stage: release
  tags: [linux-truenas]
  # Kaniko builds and pushes without a Docker daemon, so no privileged
  # dind service is required.
  image:
    name: martizih/kaniko:v1.28.5-debug
    entrypoint: [""]
  resource_group: docker-image
  timeout: 2h
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/devinorium
  script:
    - mkdir -p /kaniko/.docker
    - |
      printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}\n' \
        "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" \
        > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$IMAGE:$CI_COMMIT_TAG"
      --destination "$IMAGE:latest"
