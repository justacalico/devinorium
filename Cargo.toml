[package]
name = "devinorium"
version = "0.8.1"
edition = "2021"
rust-version = "1.88.0"
license = "AGPL-3.0-only"
description = "A secure, self-hostable Material 3 web UI for managing Devin work from anywhere."
repository = "https://gitlab.com/HttpAnimations/devinorium"
homepage = "https://gitlab.com/HttpAnimations/devinorium"

[[bin]]
name = "devinorium"
path = "src/main.rs"

[lib]
name = "devinorium"
path = "src/lib.rs"

[workspace]
resolver = "2"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "fs", "cors", "limit", "set-header"] }
hyper = { version = "1", features = ["full"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Auth & crypto
argon2 = "0.5"
rand = "0.8"
totp-rs = { version = "5", features = ["qr", "gen_secret"] }
base64 = "0.22"
subtle = "2"
constant_time_eq = "0.3"

# Sessions / tokens
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Templating / utils
once_cell = "1"
mime_guess = "2"
percent-encoding = "2"
async-trait = "0.1"
regex = "1"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15.7"
include_dir = "0.7"
which = "7"
tempfile = "3"
agent-client-protocol = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio-tungstenite = { version = "0.23", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
