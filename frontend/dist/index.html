<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Devinorium — a self-hosted AI coding assistant.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Devinorium">
  <meta name="theme-color" content="#22D3EE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Devinorium</title>
  <link rel="manifest" href="manifest.json">

  <!-- Hint the browser to set up the connection for CanvasKit/SKWasm. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">

  <!-- Preload the Flutter bootstrap and main script so the browser can start
       fetching them before the inline script in the body runs. -->
  <link rel="preload" href="flutter_bootstrap.js" as="script" fetchpriority="high">
  <link rel="preload" href="flutter.js" as="script" fetchpriority="high">
  <link rel="preload" href="main.dart.js" as="script" fetchpriority="high">
  <link rel="preload" href="main.dart.mjs" as="script" fetchpriority="high">
  <link rel="preload" href="main.dart.wasm" as="fetch" crossorigin fetchpriority="high">

  <!-- Fonts and icons are large enough that starting them early helps first paint. -->
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="assets/packages/cupertino_icons/assets/CupertinoIcons.ttf" as="font" type="font/ttf" crossorigin>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
