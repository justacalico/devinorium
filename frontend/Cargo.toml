[package]
name = "devinorium-frontend"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
dioxus = { version = "0.6", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement",
    "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement",
    "HtmlFormElement", "FormData", "File", "FileList", "FileReader",
    "Headers", "Request", "RequestInit", "RequestMode", "Response",
    "Storage", "Location", "History", "Clipboard",
    "DragEvent", "DataTransfer", "MouseEvent", "KeyboardEvent",
    "ScrollIntoViewOptions", "ScrollLogicalPosition", "ScrollBehavior",
    "DomRect", "CssStyleDeclaration",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
