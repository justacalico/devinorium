name: devinorium_frontend
description: "Devinorium — Flutter web frontend."
publish_to: "none"
version: 0.59.0+79

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.0
  web: ^1.1.1
  markdown: ^7.2.0
  flutter_dropzone: ^4.2.1
  shared_preferences: ^2.5.5
  flutter_markdown_plus: ^1.0.7
  window_manager: ^0.5.2
  path: ^1.9.1
  url_launcher: ^6.3.2
  flutter_linkify: ^6.0.0
  mime: ^2.0.0
  flutter_svg: ^2.3.0
  file_picker: 12.0.0
  desktop_drop: 0.8.0
  pasteboard: 0.5.0
  xterm: ^4.0.0
  web_socket_channel: ^3.0.1
  pty2: ^0.5.3
  package_info_plus: ^10.2.1
  image_picker: ^1.2.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  async: ^2.13.0
  stream_channel: ^2.1.4
  fake_async: ^1.3.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/providers/

flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0F172A"
  web:
    generate: true
    background_color: "#0F172A"
    theme_color: "#22D3EE"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
