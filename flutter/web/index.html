  <script>
    // The Flutter engine replaces any static viewport meta at startup, so
    // viewport-fit=cover has to be patched back in for the standalone iOS
    // web app to extend under the notch and home indicator.
    (function () {
      function addViewportFit() {
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta && meta.content.indexOf('viewport-fit') === -1) {
          meta.content += ', viewport-fit=cover';
        }
      }
      addViewportFit();
      new MutationObserver(addViewportFit).observe(document.head, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['content'],
      });
    })();
  </script>

  <!-- Preload the Flutter bootstrap and main script so the browser can start

  <link rel="preload" href="main.dart.js" as="script" fetchpriority="high">

  <link rel="preload" href="main.dart.wasm" as="fetch" crossorigin fetchpriority="high">
